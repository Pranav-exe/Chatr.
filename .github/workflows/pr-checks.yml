name: PR Checks
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: |
          helm lint ./Helm

      - name: Template Helm chart
        run: |
          helm template test-release ./Helm > /dev/null
          echo "✅ Chart templates rendered successfully"

      - name: Template with dev values
        run: |
          helm template test-release ./Helm -f ./Helm/values-dev.yaml > /dev/null
          echo "✅ Dev values validated"

      # Frontend code quality gate (ESLint)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Frontend lint
        run: npm run lint
        working-directory: client

  trivy-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin v0.50.0

      - name: Trivy config scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 ./Helm
