name: PR Checks
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: |
          helm lint ./Helm

      - name: Template Helm chart
        run: |
          helm template test-release ./Helm > /dev/null
          echo "✅ Chart templates rendered successfully"

      - name: Template with dev values
        run: |
          helm template test-release ./Helm -f ./Helm/values-dev.yaml > /dev/null
          echo "✅ Dev values validated"

      # Frontend code quality gate (ESLint)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Frontend lint
        run: npm run lint
        working-directory: client

  trivy-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy (pinned, checksum verified)
        run: |
          VERSION=0.71.2
          BASE=https://github.com/aquasecurity/trivy/releases/download/v${VERSION}
          curl -sSfLO ${BASE}/trivy_${VERSION}_Linux-64bit.tar.gz
          curl -sSfLO ${BASE}/trivy_${VERSION}_checksums.txt
          grep "trivy_${VERSION}_Linux-64bit.tar.gz" trivy_${VERSION}_checksums.txt | sha256sum --check -
          tar -xzf trivy_${VERSION}_Linux-64bit.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Trivy config scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 ./Helm
