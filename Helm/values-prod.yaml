global:
  imageRegistry: "docker.io/pranavsharrma"

backend:
  replicaCount: 1
  image:
    repository: chatr-server # must match your Docker Hub backend repo name
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 400Mi

# Top-level, matching values.yaml (the old backend.config was likely ignored)
config:
  nodeEnv: production
  redisHost: redis
  redisPort: "6379"
  allowedOrigins: "http://af1f3fa952302491cbffc288b67d327d-1017246815.ap-south-1.elb.amazonaws.com"
  useHttps: "false"

secrets:
  existingSecretName: "backend-secret"
  jwtSecret: ""
  mongo:
    username: ""
    password: ""

mongodb:
  enabled: true
  auth:
    rootUsername: chatr_admin
    existingSecret: "backend-secret"
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
    limits:
      cpu: 500m
      memory: 800Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 200Mi

nginx:
  replicaCount: 1
  image:
    repository: chatr-nginx
    tag: latest
    pullPolicy: Always
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: false

certManager:
  enabled: false

hpa:
  backend:
    enabled: false
  nginx:
    enabled: false
